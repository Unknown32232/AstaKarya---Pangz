<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - AstaKarya</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .sidebar {
        min-height: 100vh;
        background-color: #0f172a;
        color: white;

        /* --- TAMBAHAN PENTING (Agar tidak menumpuk) --- */
        position: relative !important; /* Membatalkan position fixed dari style.css lama */
        width: 250px;
        flex-shrink: 0; /* Agar sidebar tidak tergencet */
      }

      .sidebar a {
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        padding: 10px 20px;
        display: block;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div
        class="sidebar d-flex flex-column flex-shrink-0 p-3"
        style="width: 250px"
      >
        <a
          href="#"
          class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none"
        >
          <span class="fs-4 fw-bold"
            ><i class="bi bi-brush-fill"></i> Admin</span
          >
        </a>
        <hr />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a
              href="dashboard.html"
              class="nav-link active"
              aria-current="page"
            >
              <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
          </li>

          <li>
            <a href="management.html" class="nav-link text-white">
              <i class="bi bi-folder2-open me-2"></i> Manajemen Data
            </a>
          </li>

          <li>
            <a
              href="#"
              class="nav-link text-white"
              onclick="alert('Fitur Manajemen Pengguna belum tersedia!'); return false;"
            >
              <i class="bi bi-people me-2"></i> Pengguna
            </a>
          </li>
        </ul>

        <hr />
        <div class="dropdown">
          <a
            href="#"
            class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
            id="dropdownUser1"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-person-circle me-2"></i>
            <strong>Admin</strong>
          </a>
          <ul
            class="dropdown-menu dropdown-menu-dark text-small shadow"
            aria-labelledby="dropdownUser1"
          >
            <li>
              <button class="dropdown-item text-warning" id="resetBtn">
                <i class="bi bi-arrow-counterclockwise me-2"></i> Reset Data
              </button>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button class="dropdown-item" id="logoutBtn">Sign out</button>
            </li>
          </ul>
        </div>
      </div>

      <div class="flex-grow-1 p-4 bg-light">
        <h2>Dashboard Overview</h2>
        <p class="text-muted">Selamat datang kembali, Administrator.</p>

        <div class="row mb-4">
          <div class="col-md-4">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Total Pendapatan</h6>
                <h3 id="totalRevenue">Rp 0</h3>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Total Pesanan</h6>
                <h3 id="totalOrders">0</h3>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Produk Aktif</h6>
                <h3 id="totalProducts">0</h3>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-8">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white">Tren Penjualan</div>
              <div class="card-body" style="height: 520px">
                <canvas id="salesChart"></canvas>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white">Sebaran Kategori</div>
              <div class="card-body">
                <canvas id="categoryChart" height="200"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
