<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist Saya - AstaKarya</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="home.html">
          <i class="bi bi-brush-fill"></i> AstaKarya
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="home.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="home.html#kategori">Kategori</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="home.html#pengrajin">Pengrajin</a>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link nav-icon active" href="wishlist.html">
                <i class="bi bi-heart-fill text-danger"></i>
                <span class="wishlist-badge" id="wishlistCount">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-icon" href="cart.html">
                <i class="bi bi-cart3"></i>
                <span class="cart-badge" id="cartCount">0</span>
              </a>
            </li>
            <li class="nav-item dropdown ms-2">
              <a
                class="nav-link dropdown-toggle user-info"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle me-1"></i>
                <span id="currentUser">User</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <button class="dropdown-item text-danger" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i> Logout
                  </button>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <h2 class="mb-4">Wishlist Saya</h2>

      <div
        id="emptyWishlistMessage"
        class="text-center py-5"
        style="display: none"
      >
        <i class="bi bi-heart-break display-1 text-muted"></i>
        <h4 class="mt-3">Wishlist Masih Kosong</h4>
        <p class="text-muted">
          Simpan barang impianmu di sini sebelum kehabisan!
        </p>
        <a href="home.html" class="btn btn-primary mt-3">Cari Produk</a>
      </div>

      <div class="card border-0 shadow-sm" id="wishlistContainer">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="bg-light">
                <tr>
                  <th class="ps-4 py-3">Produk</th>
                  <th>Harga</th>
                  <th>Status Stok</th>
                  <th class="text-end pe-4">Aksi</th>
                </tr>
              </thead>
              <tbody id="wishlistTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/user.js"></script>
  </body>
</html>
