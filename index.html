<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AstaKarya</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="card login-card">
        <div class="card-body">
          <div class="text-center mb-4">
            <h2><i class="bi bi-brush-fill"></i> AstaKarya</h2>
            <p class="text-muted">Masuk untuk melanjutkan</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="user / admin"
                required
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="user / admin"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
          </form>

          <div class="mt-3 text-center">
            <small class="text-muted d-block mt-2">Akun Demo:</small>
            <span class="badge bg-light text-dark border">user / user</span>
            <span class="badge bg-light text-dark border">admin / admin</span>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/data.js"></script>

    <script>
      // Logika Login
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const u = document.getElementById("username").value;
          const p = document.getElementById("password").value;

          // Panggil fungsi login dari data.js
          const user = login(u, p);

          if (user) {
            // Redirect sesuai Role
            if (user.role === "admin") {
              window.location.href = "admin/dashboard.html";
            } else {
              window.location.href = "user/home.html";
            }
          } else {
            alert("Username atau Password salah!");
          }
        });

      // Cek jika sudah login sebelumnya
      const currentSession = JSON.parse(localStorage.getItem(SESSION_KEY));
      if (currentSession) {
        if (currentSession.role === "admin")
          window.location.href = "admin/dashboard.html";
        else window.location.href = "user/home.html";
      }
    </script>
  </body>
</html>
